name: Engine fault handling

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Host worker, decoder, production UI and resource regressions
        run: make -C source/native test CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
      - name: Production plugin syntax check
        run: |
          ${{ matrix.cxx }} -std=gnu++98 -Wall -Wextra -Werror -Isource/native/sdk -Isource/native/src/common -Isource/native/src/ipc -fsyntax-only source/native/src/plugins/engine_codes.cpp
          for mode in '' '-DID6_EMULATOR'; do
            ${{ matrix.cxx }} -std=gnu++98 -Wall -Wextra -Werror -DID6_ENTRY_PAGE=surface_codes '-DID6_PLUGIN_NAME="HostFaultSyntax"' $mode -Isource/fullscreen/native/src -Isource/fullscreen/native/generated -isystem source/fullscreen/native/sdk -Isource/fullscreen/native/telemetry/common -Isource/fullscreen/native/telemetry/ipc -Isource/native/src/common -fsyntax-only source/fullscreen/native/src/library.cpp
          done
      - name: Synthetic full-screen preview and resource contracts
        run: |
          python3 -m pip install Pillow==13.0.0
          python3 -B source/tools/test_full_warm_resources.py
          make -C source/native build/full-warm-surface.so CC=${{ matrix.cc }}
          python3 -B source/tools/preview_full_faults.py --renderer source/native/build/full-warm-surface.so --models source/native/build/full-fault-models/raw.bin --out /tmp/full-fault-host-synthetic.png
      - uses: actions/upload-artifact@v4
        with:
          name: full-fault-host-preview-${{ matrix.cc }}
          path: /tmp/full-fault-host-synthetic.png
      - name: Static analysis
        if: matrix.cc == 'clang'
        run: |
          clang++ --analyze -Xanalyzer -analyzer-output=text -std=gnu++98 -Isource/native/sdk -Isource/native/src/common -Isource/native/src/ipc source/native/src/plugins/engine_codes.cpp
          clang --analyze -Xanalyzer -analyzer-output=text -std=c99 -DMOST_HOST -Isource/native/src/common -Isource/native/src/ipc -Isource/native/src/workers source/native/src/workers/engine_codes_worker.c
  memory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fault decoder, status/profile and production callback memory checks
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: make -C source/native test-faults CC=clang CXX=clang++ CFLAGS='-O1 -g -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer' CXXFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
